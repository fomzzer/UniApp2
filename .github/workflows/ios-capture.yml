name: iOS capture

# Records the simulator while a UI test runs, and uploads the video
# plus per-frame PNGs for checking interactions frame by frame.

on:
  workflow_dispatch:
    inputs:
      test:
        description: UI tests to record, separated by spaces
        default: UniAppUITests/TabTransitionCaptureTests
      fps:
        description: Frames per second to extract
        default: "15"
      ios:
        description: Simulator iOS version, like 26 or 18.6
        default: "26"

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen xcbeautify ffmpeg
          xcodegen generate

      - name: Boot simulator
        env:
          IOS_VERSION: ${{ inputs.ios }}
        run: |
          RUNTIME_KEY="iOS-$(echo "${IOS_VERSION:-26}" | tr . -)"
          find_device() {
            xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if '$RUNTIME_KEY' in k for x in v if x['name'].startswith('iPhone')), ''))"
          }
          DEVICE_ID=$(find_device)
          if [ -z "$DEVICE_ID" ]; then
            xcrun simctl list runtimes
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION"
            RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; print(next(r['identifier'] for r in json.load(sys.stdin)['runtimes'] if '$RUNTIME_KEY' in r['identifier']))")
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next(t['identifier'] for t in reversed(json.load(sys.stdin)['devicetypes']) if 'iPhone-16-Pro' in t['identifier'] or 'iPhone-16' in t['identifier']))")
            DEVICE_ID=$(xcrun simctl create "Capture iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project UniApp.xcodeproj \
            -scheme UniAppCapture \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/capture \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Record UI test
        env:
          ONLY_TESTING: ${{ inputs.test }}
        run: |
          set -o pipefail
          mkdir -p capture
          xcrun simctl io "$DEVICE_ID" recordVideo --codec h264 --force capture/run.mov &
          RECORDER=$!
          sleep 2
          xcodebuild test-without-building \
            -project UniApp.xcodeproj \
            -scheme UniAppCapture \
            -destination "id=$DEVICE_ID" \
            $(printf -- '-only-testing:%s ' $ONLY_TESTING) \
            -derivedDataPath build/capture | xcbeautify --renderer github-actions || STATUS=$?
          kill -INT $RECORDER
          wait $RECORDER || true
          exit ${STATUS:-0}

      - name: Extract frames
        if: always()
        env:
          FPS: ${{ inputs.fps }}
        run: |
          mkdir -p capture/frames
          ffmpeg -loglevel error -i capture/run.mov -vf "fps=${FPS:-15},scale=390:-2" capture/frames/%05d.png
          ls capture/frames | wc -l

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: capture-${{ github.run_number }}
          path: ios/capture
          retention-days: 7
