name: iOS screens

# Installs the app on a simulator of the chosen iOS version, launches it on
# each main screen with fixture data and uploads the screenshots and logs.

on:
  workflow_dispatch:
    inputs:
      ios:
        description: Simulator iOS version, like 26 or 18.6
        default: "18.6"

permissions:
  contents: read

jobs:
  screens:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Boot simulator
        env:
          IOS_VERSION: ${{ inputs.ios }}
        run: |
          RUNTIME_KEY="iOS-$(echo "${IOS_VERSION:-18.6}" | tr . -)"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if '$RUNTIME_KEY' in k for x in v if x['name'].startswith('iPhone')), ''))")
          if [ -z "$DEVICE_ID" ]; then
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION"
            RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; print(next(r['identifier'] for r in json.load(sys.stdin)['runtimes'] if '$RUNTIME_KEY' in r['identifier']))")
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next(t['identifier'] for t in reversed(json.load(sys.stdin)['devicetypes']) if 'iPhone-16' in t['identifier']))")
            DEVICE_ID=$(xcrun simctl create "Screens iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project UniApp.xcodeproj \
            -scheme UniApp \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/screens \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
          xcrun simctl install "$DEVICE_ID" build/screens/Build/Products/Debug-iphonesimulator/UniApp.app

      - name: Capture screens
        run: |
          mkdir -p screens
          python3 - <<'PY'
          import re
          for source, name in [("UniAppTests/Fixtures.swift", "snapshot"), ("UniAppUITests/TimetableFixture.swift", "json")]:
              text = open(source, encoding="utf-8").read()
              match = re.search(r"static let " + name + r' = #"""\n(.*?)\n"""#', text, re.S)
              open(f"screens/{name}.json", "w", encoding="utf-8").write(match.group(1))
          PY
          export SIMCTL_CHILD_UNIAPP_UITEST_SNAPSHOT="$(cat screens/snapshot.json)"
          export SIMCTL_CHILD_UNIAPP_UITEST_TIMETABLE="$(cat screens/json.json)"
          export SIMCTL_CHILD_UNIAPP_UITEST_MAIL=1
          xcrun simctl status_bar "$DEVICE_ID" override --time 10:30 || true
          for screen in home grades schedule profile mail; do
            xcrun simctl terminate "$DEVICE_ID" com.fomzzer.uniapp 2>/dev/null || true
            if [ "$screen" = mail ]; then
              SIMCTL_CHILD_UNIAPP_UITEST_TAB=home SIMCTL_CHILD_UNIAPP_UITEST_OPEN_MAIL=1 xcrun simctl launch "$DEVICE_ID" com.fomzzer.uniapp -AppleLanguages "(ru)" -AppleLocale ru_RU -settings.language ru -timetable.group 37б
            else
              SIMCTL_CHILD_UNIAPP_UITEST_TAB=$screen xcrun simctl launch "$DEVICE_ID" com.fomzzer.uniapp -AppleLanguages "(ru)" -AppleLocale ru_RU -settings.language ru -timetable.group 37б
            fi
            sleep 25
            xcrun simctl io "$DEVICE_ID" screenshot "screens/$screen.png"
            xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -q uniapp || echo "UniApp is not running after opening $screen"
          done
          xcrun simctl spawn "$DEVICE_ID" log show --last 15m --style compact --predicate 'process == "UniApp" AND (messageType == error OR messageType == fault)' > screens/app.log || true
          ls -la screens
          find ~/Library/Logs/DiagnosticReports -name "UniApp*" -newer screens/snapshot.json -exec cp {} screens/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens-${{ inputs.ios }}-${{ github.run_number }}
          path: ios/screens
          retention-days: 7
