name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version from commits
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          COMMIT=$(git rev-parse --short=7 HEAD)
          echo "MARKETING_VERSION=2.0.$COUNT" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$COUNT" >> "$GITHUB_ENV"
          echo "UNIAPP_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project UniApp.xcodeproj \
            -scheme UniApp \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/test \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            UNIAPP_COMMIT="$UNIAPP_COMMIT" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project UniApp.xcodeproj \
            -scheme UniApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/release \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            UNIAPP_COMMIT="$UNIAPP_COMMIT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcbeautify --renderer github-actions
          mkdir -p Payload
          cp -R build/release/Build/Products/Release-iphoneos/UniApp.app Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :UniAppCommit" Payload/UniApp.app/Info.plist
          zip -qry UniApp.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: UniApp-${{ steps.version.outputs.count }}-unsigned-ipa
          path: ios/UniApp.ipa
          retention-days: 30
