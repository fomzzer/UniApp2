name: UniApp
options:
  bundleIdPrefix: com.fomzzer
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: bg
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.5"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  UniApp:
    type: application
    platform: iOS
    sources:
      - path: UniApp
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: UniApp
        CFBundleDevelopmentRegion: bg
        CFBundleLocalizations: [bg, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: UniApp използва Face ID, за да защити оценките и личните ти данни.
        UniAppAPIHost: $(UNIAPP_API_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fomzzer.uniapp
        PRODUCT_NAME: UniApp
        UNIAPP_API_HOST: 20-215-255-122.sslip.io
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  UniAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniAppTests
    dependencies:
      - target: UniApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fomzzer.uniapp.tests
schemes:
  UniApp:
    build:
      targets:
        UniApp: all
    test:
      targets:
        - UniAppTests
